<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Permissions — Cabinet RAPHA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <style>
    body { font-family: 'Inter', sans-serif; }
    input[type="checkbox"] { accent-color: #0F2A47; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-gray-800 p-4 md:p-8">

  <!-- Header -->
  <header class="flex flex-col md:flex-row items-center justify-between bg-white/60 backdrop-blur-md shadow-sm px-6 py-4 mb-8 rounded-xl gap-3 border border-slate-200 max-w-5xl mx-auto">
    <div class="flex items-center gap-4 flex-wrap">
      <a href="/" class="text-[#0F2A47] hover:text-[#1E3A5F] font-semibold text-lg">
        <i class="fa-solid fa-arrow-left"></i> Retour au menu
      </a>
      <h1 class="text-2xl font-bold text-slate-900">
        <i class="fa-solid fa-shield-halved text-[#0F2A47]"></i> Permissions
      </h1>
    </div>
    <p class="text-gray-500 text-sm italic hidden md:block">
      Configurer la visibilité des colonnes par rôle
    </p>
  </header>

  <script>
    const allColumns = [
      'created_at','name','adresse','age','poids','taille','tension_arterielle',
      'temperature','hypothese_de_diagnostique','renseignements_clinique','bilan',
      'resultat_bilan','ordonnance','signature','meeting','new_cases','phone_number'
    ];
  </script>

  <main class="max-w-5xl mx-auto pb-10 space-y-6">
    {% for role in roles %}
      <div class="bg-white rounded-2xl p-6 shadow-md border border-slate-200 transition hover:shadow-lg">
        <h3 class="text-lg font-semibold text-slate-900 mb-4 pb-2 border-b border-slate-200">
          <i class="fa-solid fa-user-tag text-[#0F2A47] mr-2"></i>{{ role.role|capitalize }}
        </h3>
        <form onsubmit="return saveVisibility('{{ role.role }}', this)">
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-x-4 gap-y-2 mb-5">
            {% for col in allColumns %}
              <label class="flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-slate-50 cursor-pointer transition">
                <input type="checkbox" name="columns" value="{{ col }}"
                       class="w-4 h-4 rounded border-slate-300 text-[#0F2A47] focus:ring-2 focus:ring-[#0F2A47]/30"
                       {% if col in role.columns %}checked{% endif %}>
                <span class="text-sm text-slate-700">{{ col }}</span>
              </label>
            {% endfor %}
          </div>
          <div class="flex items-center justify-end gap-3">
            <span class="save-msg hidden text-sm"></span>
            <button type="submit"
                    class="inline-flex items-center gap-2 text-white font-medium px-4 py-2 rounded-lg bg-[#0F2A47] hover:bg-[#1E3A5F] shadow-sm transition">
              <i class="fa-solid fa-floppy-disk"></i>
              <span>Enregistrer</span>
            </button>
          </div>
        </form>
      </div>
    {% endfor %}
  </main>

  <script>
    function saveVisibility(role, form) {
      const formData = new FormData(form);
      const selected = formData.getAll("columns");
      const msg = form.querySelector('.save-msg');

      fetch("/update_visibility", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ role: role, columns: selected })
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === "success") {
          msg.innerHTML = '<i class="fa-solid fa-check"></i> Permissions des ' + role + ' enregistrées';
          msg.className = 'save-msg text-sm text-emerald-600';
          setTimeout(() => { msg.classList.add('hidden'); }, 2500);
        } else {
          msg.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Erreur : ' + (data.message || 'inconnue');
          msg.className = 'save-msg text-sm text-red-600';
        }
      })
      .catch(err => {
        msg.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Erreur réseau : ' + err.message;
        msg.className = 'save-msg text-sm text-red-600';
      });
      return false;
    }
  </script>
</body>
</html>
