<!-- templates/login.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Connexion - Medical System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- TailwindCSS and Fonts -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Custom Styles -->
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #ffffff;
      color: #111111;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
    }

    .glow-button {
      background: linear-gradient(90deg, #0F2A47, #1E3A5F);
      color: #ffffff;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 4px 14px rgba(15, 42, 71, 0.25);
      position: relative;
      overflow: hidden;
      z-index: 1;
      border: none;
    }

    .glow-button::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, #1E3A5F, #0F2A47, #1E3A5F);
      opacity: 0;
      transition: opacity 0.4s ease;
      z-index: -1;
      background-size: 200% auto;
    }

    .glow-button:hover::before {
      opacity: 1;
      animation: shimmer 2s linear infinite;
    }

    @keyframes shimmer {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    .input-field {
      background-color: rgba(255, 255, 255, 0.9);
      border: 1px solid #ccc;
      color: #111111;
      transition: all 0.3s ease;
    }

    .input-field::placeholder {
      color: #666;
    }

    .input-field:focus {
      border-color: #0F2A47;
      box-shadow: 0 0 0 3px rgba(15, 42, 71, 0.18);
      background-color: #ffffff;
    }

    /* Mobile tweaks */
    @media (max-width: 640px) {
      .form-container {
        padding: 1.5rem; /* tighter padding */
      }

      h1 {
        font-size: 1.75rem;
      }

      .input-field {
        padding: 0.75rem 1rem;
        font-size: 0.95rem;
      }

      .glow-button {
        font-size: 1rem;
        padding: 0.75rem;
      }
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 bg-slate-50">

  <div class="form-container bg-white border border-slate-200 rounded-2xl shadow-xl p-8 sm:p-10 w-full max-w-md">
    <div class="flex flex-col items-center mb-6 sm:mb-8">
      <img src="https://allarassemjonathan.github.io/kiceko.png" class="h-20 sm:h-24 mb-4" alt="Logo">
      <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900">Connexion</h1>
    </div>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="mb-4 text-red-600 text-center text-sm space-y-1">
          {% for message in messages %}
            <p>{{ message }}</p>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST" class="space-y-5 sm:space-y-6">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
        <input id="email" type="email" class="input-field w-full p-3 sm:p-4 rounded-xl text-sm sm:text-base" name="email" placeholder="email@exemple.com" required>
      </div>

      <div class="relative">
        <label class="block text-sm font-medium text-slate-700 mb-1">Mot de passe</label>
        <input id="password" type="password" name="password" required placeholder="••••••••" class="input-field w-full p-3 sm:p-4 rounded-xl text-sm sm:text-base">
        <span class="absolute inset-y-0 right-3 flex items-center cursor-pointer text-gray-500 hover:text-gray-700 select-none" onclick="togglePassword()">👁</span>
      </div>

      <div>
        <button type="submit" class="glow-button w-full py-2.5 sm:py-3 rounded-xl text-base sm:text-lg">Se connecter</button>
      </div>
    </form>

    <script>
      function togglePassword() {
        const passwordInput = document.getElementById("password");
        passwordInput.type = passwordInput.type === "password" ? "text" : "password";
      }
    </script>
  </div>
</body>
</html>
